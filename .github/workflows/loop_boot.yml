# Reduced to 3 loops with 90s delay to stay within OCI API rate limits
          for i in {1..3}
          do
            echo "Firing Request Loop #$i using path: $OCI_BIN"

            RESPONSE=$($OCI_BIN compute instance launch \
              --availability-domain "$AD_NAME" \
              --compartment-id "$COMPARTMENT_ID" \
              --shape "VM.Standard.A1.Flex" \
              --shape-config '{"ocpus":2.0,"memoryInGBs":12.0}' \
              --display-name "GitHub-Ampere-Node" \
              --image-id "$IMAGE_ID" \
              --subnet-id "$SUBNET_ID" \
              --ssh-authorized-keys-file ssh_key.pub \
              2>&1) || {
              echo "❌ Request failed:"
              echo "$RESPONSE"
              echo "Waiting 90 seconds to avoid HTTP 429 rate limits..."
              sleep 90
              continue
            }

            if [[ "$RESPONSE" == *"id"* ]]; then
              echo "🎉 SUCCESS! Your Ampere Server has been provisioned!"
              exit 0
            fi
          done
